changelog: |-
  - Works on Jellyfin 12 as well as 10.11. The self-service page now
    authenticates the way Jellyfin 12 requires, so it no longer asks users to
    sign in when they are already signed in. Everything else was checked on a
    12.0 server: linking, scrobbling, the import and export passes, the sync
    switch and the Logs tab.
  - The plugin has a logo: an RK monogram cut through by the scrobble pulse. It
    shows in the plugin catalogue, at the top of both settings pages and on the
    repository page.
  - The result of a preview, an import or an export is no longer only a count:
    click a number and a window lists the items behind it, one line per title
    with its watch date.
  - Carried over from Beta 2: the three-step Simkl sync with its guided status
    box, the independent Import and Export cards, the immediate Turn on sync
    button, the Logs tab, the sync state tied to the Simkl account, and an
    export that leaves alone what Simkl already has.
