category: "General"
artifacts:
  - "Jellyfin.Plugin.Simkl.dll"
changelog: |-
  - Beta 1 of the Simkl sync (experimental, off by default). A new "Simkl sync"
    tab sets it up in three steps. 1. Simkl to Jellyfin: marks as played, in
    Jellyfin, the episodes and movies your Simkl history lists (watch date and
    play count included; only items present in your libraries, unmatched ones
    are retried after each library scan). 2. Jellyfin to Simkl: sends to Simkl
    what Jellyfin has as played and Simkl does not have yet. 3. Keep in sync:
    follows the Simkl history after each playback and library scan, at most once
    an hour. Each step shows a preview before anything is written, both
    directions can be undone for 7 days, a pass that would change more than 200
    items waits for your confirmation, and excluded libraries are left alone.
    Anime is not covered. Every linked profile sets it up on its own page.
  - Finished watches are kept while a Simkl link is expired and sent once the
    account is linked again (up to 30 days).
  - New Logs tab on the admin page: a diagnostic report (versions, a settings
    summary without tokens, the plugin's recent log lines, token-like strings
    masked) to copy into a bug report.
  - Settings pages redesigned: the users' link first, then the profile, then
    Account / Scrobbling / Simkl sync / Logs tabs. Both pages are wider.
  - Simkl reads are paced like writes, at least one second apart per user, so
    linking an account no longer trips Simkl's burst detector.
