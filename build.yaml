changelog: |-
  - The plugin is now called "RK Simkl Scrobbler" (RK for romskidd), at Simkl's
    request, to avoid any confusion with Simkl's own apps and the official
    Jellyfin plugin. It is an unofficial plugin, not affiliated with or endorsed
    by Simkl or Jellyfin. The plugin id is unchanged: nothing to do, updates
    continue as before.
  - Rewatches are now handled by Simkl directly on the scrobble stop (Pro/VIP):
    the plugin no longer asks Simkl whether an item was watched before playback
    and no longer writes a separate history entry. Two requests less per
    episode, same safeguards (opt-in, paid plan, at least half of the item
    played this session).
  - Following Simkl's API review: account settings and watch statistics are
    only re-read when Simkl's activity feed reports a change, and the PIN
    status is polled at the interval Simkl asks for.
  - The plugin identifies itself to Simkl as rk-simkl-scrobbler.
