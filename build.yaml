artifacts:
  - "Jellyfin.Plugin.Simkl.dll"
changelog: |-
  - Beta of the Simkl sync (experimental, off by default). A new "Simkl sync"
    tab sets it up in three steps. 1. Simkl to Jellyfin: marks as played, in
    Jellyfin, the episodes and movies your Simkl history lists (watch date and
    play count included; only items present in your libraries, unmatched ones
    are retried after each library scan). 2. Jellyfin to Simkl: sends to Simkl
    what Jellyfin has as played and Simkl does not have yet. 3. Keep in sync:
    follows the Simkl history after each playback and library scan, at most once
    an hour. Each step shows a preview before anything is written, both
    directions can be undone for 7 days, a pass that would change more than 200
    items waits for your confirmation, and excluded libraries are left alone.
    Anime is not covered. Every linked profile sets it up on its own page.
  - Finished watches are kept while a Simkl link is expired and sent once the
    account is linked again (up to 30 days).
  - New Logs tab on the admin page: a diagnostic report (versions, a settings
    summary without tokens, the plugin's recent log lines, token-like strings
    masked) to copy into a bug report.
  - Settings pages redesigned: the users' link first, then the profile, then
    Account / Scrobbling / Simkl sync / Logs tabs. Both pages are wider, and the
    self-service page has the same look as the admin page.
  - Simkl reads are paced like writes, at least one second apart per user, and
    requests are paced server-wide too (at least 0.6 s apart, whichever
    profile), so linking or starting with several profiles never trips Simkl's
    burst detector.
  - Beta 2 additions. The sync state belongs to the Simkl account: link a
    profile to another account and its steps start over (what was marked in
    Jellyfin stays as it is).
  - Step 2 (Jellyfin to Simkl) reads the Simkl history first and leaves out what
    Simkl already lists as watched: it never moves your watch dates, and its
    undo only removes what it added. Only the batches Simkl accepted are
    recorded as sent.
  - A save on the admin page no longer overwrites the account details and sync
    state the server maintains, and the page reloads them after a link, a log
    out or a save. Profiles linked to the same Simkl account (Simkl hands them
    the same token) all get the account details.
  - A login Simkl rejects is detected on every call, and a history write Simkl
    refuses is no longer counted as sent. Unmatched Simkl items are retried
    after a library scan for every profile that did step 1.
  - Self-service page: the library list only shows what the user may see,
    unlinking forgets the cached account, PIN polling never faster than 5 s.
    Retry passes no longer overlap, and a stop no longer forgets a newer
    playback in the same session.
